##
## tinyproxy configuratie voor de Realworks static-IP egress proxy.
## Draait op de OVH-server (vast IP 57.129.19.232) en wordt door de Vercel
## function gebruikt via REALWORKS_PROXY_URL.
##
## Beveiliging:
##  - BasicAuth verplicht (Vercel-functies hebben dynamische IP's, dus we kunnen
##    clients niet op IP filteren — auth is de bescherming).
##  - CONNECT alleen toegestaan naar poort 443. De Realworks-call gaat via een
##    HTTPS CONNECT-tunnel: de proxy ziet alleen de hostname, NIET het token.
##

User tinyproxy
Group tinyproxy

# Luister op alle interfaces, niet-default poort.
Port 8443
Listen 0.0.0.0

Timeout 600

# Geen "Allow"-regels => alle clients toegestaan, maar BasicAuth blijft verplicht.
BasicAuth realworks REPLACE_WITH_PROXY_PASSWORD

# Verberg dat we tinyproxy zijn.
DisableViaHeader Yes

# Sta CONNECT-tunneling ALLEEN toe naar 443 (HTTPS). Hierdoor kan de proxy niet
# als open relay voor willekeurige poorten misbruikt worden.
ConnectPort 443

PidFile "/run/tinyproxy/tinyproxy.pid"
LogLevel Info

MaxClients 100
StartServers 5
MinSpareServers 5
MaxSpareServers 20
